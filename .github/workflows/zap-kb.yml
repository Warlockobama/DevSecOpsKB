name: build-zap-kb

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zap-kb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: zap-kb/go.mod

      - name: Tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format check
        run: |
          gofmt -l . | tee /tmp/gofmt.txt
          if [ -s /tmp/gofmt.txt ]; then
            echo "Found unformatted files:" && cat /tmp/gofmt.txt
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (Go packages)
        run: make test

      - name: Test (offline integration)
        run: make test-offline-e2e

      # This target scopes the CLI contract suite explicitly.  New contract
      # tests from the reliability work automatically become required here.
      - name: Test (CLI contract)
        run: make test-cli-contract

      - name: Test (synthetic wiki scale)
        run: make test-wiki-scale

      - name: Build and show provenance
        run: |
          make build VERSION=ci REVISION="${GITHUB_SHA}"
          ./bin/zap-kb -version | grep -F "revision=${GITHUB_SHA}"

